services:
  postgres:
    image: postgres:16-alpine
    container_name: davax-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: davax-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: davax-backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # pip install: requirements are baked in at image build time, and a plain
    # `docker compose up` does not rebuild, so a package a teammate adds would
    # otherwise be missing until everyone remembers --build. It is a quick
    # no-op when nothing changed.
    #
    # alembic upgrade head: a fresh clone has an empty database, and every auth
    # call 500s on a missing relation until it has run. Postgres is already
    # healthy here via depends_on, and the upgrade is a no-op once the schema
    # is current, so this is safe on every restart.
    command: sh -c "pip install --quiet --disable-pip-version-check -r requirements.txt && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: davax-frontend
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modules lives in its own volume so the Linux build of each
      # package does not collide with a host's. Docker fills that volume once,
      # when the container is first created, and reuses it from then on — even
      # after the image is rebuilt with new packages. That is how a teammate's
      # new dependency (livekit-client) went missing on every existing setup.
      - /app/node_modules
